[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroswarm-automl"
version = "0.1.0"
description = "A Neural Architecture Search and AutoML engine using Evolutionary Algorithms, PSO-DE, and Surrogate Models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torcheval>=0.0.7",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
    "ignore::sklearn.exceptions.ConvergenceWarning",
]
