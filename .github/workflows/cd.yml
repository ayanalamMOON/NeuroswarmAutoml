name: NeuroSwarm AutoML CD & Automated Release

on:
  push:
    tags:
      - "v*.*.*"  # Triggers on tags like v1.0.0, v0.2.1-beta
  workflow_dispatch:
    inputs:
      version:
        description: "Target release version tag (e.g., v1.0.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-publish-release:
    name: Build Artifacts & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Packaging Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel

      - name: Determine Version Tag
        id: version_vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Release tag identified as: $TAG"

      - name: Build Python Wheel & Source Distribution
        run: |
          python -m build

      - name: Verify Package Metadata with Twine
        run: |
          twine check dist/*

      - name: Create GitHub Release & Upload Package Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NeuroSwarm AutoML ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz

  docker-build-and-push:
    name: Build & Push Container to GitHub Packages (GHCR)
    runs-on: ubuntu-latest
    needs: build-and-publish-release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
