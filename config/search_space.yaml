# NeuroSwarm-AutoML Search Space Configuration
# Declarative definition of operations, hyperparameter bounds, and search constraints.

# --- Search Parameters ---
max_generations: 50
population_size: 20
min_nodes: 4
max_nodes: 10
edge_prob: 0.4
warm_start_count: 5
eval_top_fraction: 0.20
seed: 42

# --- Genetic Algorithm (Topology Search) ---
ga:
  population_size: 20
  crossover_prob: 0.7
  mutation_prob: 0.3
  max_nodes: 10
  available_ops:
    - conv3x3
    - conv5x5
    - depthwise_conv
    - resnet_block
    - identity

# --- PSO-DE (Continuous Hyperparameters) ---
pso:
  w_max: 0.9
  w_min: 0.4
  c1: 1.496
  c2: 1.496
  de_scaling_factor: 0.6
  velocity_threshold: 0.0001
  bounds:
    - [-4.0, -1.0]    # log10(learning_rate): 1e-4 to 1e-1
    - [0.8, 0.999]    # beta1 / momentum
    - [-6.0, -2.0]    # log10(weight_decay): 1e-6 to 1e-2
    - [4.0, 8.0]      # batch_size exponent: 2^4 (16) to 2^8 (256)

# --- Surrogate Model ---
surrogate:
  alpha: 0.000001
  n_restarts_optimizer: 5
  ucb_kappa: 1.96
  min_samples_to_fit: 5
  uncertainty_threshold: 0.5

# --- Training (CUDA & GPU Acceleration) ---
training:
  short_epochs: 5
  full_epochs: 100
  in_channels: 3
  base_channels: 32
  num_classes: 10
  num_workers: 2
  use_ray: false
  gpus_per_worker: 1.0
  device: "cuda"
  use_amp: true
  pin_memory: true
  cudnn_benchmark: true
  dataset: cifar10
  data_root: ./data
